name: 3X-UI Panel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    steps:
      - name: Install 3X-UI Panel
        run: |
          sudo bash <(curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh) << EOF
          n
          EOF
          sleep 10
          
      - name: Start 3X-UI Service
        run: |
          sudo x-ui start
          sleep 5
          sudo systemctl status x-ui --no-pager
          
      - name: Get Panel Info
        run: |
          PUBLIC_IP=$(curl -s ifconfig.me)
          echo "=========================================="
          echo "Panel URL: http://${PUBLIC_IP}:54321"
          echo "Username: admin"
          echo "Password: admin"
          echo "=========================================="
          echo "Change credentials after first login!"
          echo "=========================================="
          
      - name: Setup Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          ./cloudflared-linux-amd64 tunnel --url http://localhost:54321 > /tmp/tunnel.log 2>&1 &
          sleep 10
          TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/tunnel.log | head -1)
          echo "=========================================="
          echo "Public Panel Access: $TUNNEL_URL"
          echo "=========================================="
          
      - name: Keep Panel Running
        run: |
          tail -f /tmp/tunnel.log &
          sleep 21000
